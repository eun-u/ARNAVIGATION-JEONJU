[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "navi-accessible-routing-poc"
version = "0.1.0"
description = "NaVi accessibility-aware routing proof of concept for Jeonju and Jeonbuk National University"
readme = "readme.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "networkx>=3.3,<4.0",
  "pydantic>=2.8,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "playwright>=1.55,<2.0",
  "pytest>=8.3,<9.0",
]
geo = [
  "geopandas>=1.0,<2.0",
  "osmnx>=2.1,<3.0",
  "rasterio>=1.5,<2.0",
  "shapely>=2.0,<3.0",
  "xlrd>=2.0,<3.0",
]

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]

[tool.setuptools.package-data]
app = ["config/*.json"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
addopts = "-q"
